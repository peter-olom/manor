      MANOR_SETTINGS_RESEED: ${MANOR_SETTINGS_RESEED:-0}
      MANOR_START_WAIT_TIMEOUT: ${MANOR_START_WAIT_TIMEOUT:-300}
      MANOR_STACK_LEASE_TTL_MS: ${MANOR_STACK_LEASE_TTL_MS:-1800000}
      MANOR_WORKER_EFFORT: ${MANOR_WORKER_EFFORT:-}
