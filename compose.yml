services:
  butler:
    image: "${MANOR_IMAGE_REGISTRY:-ghcr.io/peter-olom}/manor-butler:${MANOR_IMAGE_TAG:-latest}"
    container_name: manor-butler
    hostname: manor-butler
    command: ["/usr/local/bin/start-butler"]
    working_dir: /opt/manor/butler
    environment:
      MANOR_ROLE: butler
      MANOR_STATE_DIR: /state
      HOME: /home/butler
      CODEX_HOME: /home/butler/.codex
      CODEX_SHARED_HOME_DIR: /codex-home
      CODEX_SHARED_CONFIG_DIR: /codex-config
      MANOR_HARNESS_HOME: /harness-state
      MANOR_HARNESS_REGISTRY_PATH: /harness-state/harness-capabilities.json
      MANOR_HARNESS_ACCESS_FILE: /state/harness-broker-access.json
      PI_AGENT_DIR: /home/butler/.pi/agent
      WORKER_PI_AGENT_DIR: /worker-pi/agent
      WORKER_PI_SESSION_ROOT: /worker-pi/sessions
      WORKER_PI_RPC_CLI_PATH: /usr/local/bin/worker-pi-rpc-proxy.mjs
      WORKER_PI_RPC_SOCKET: /worker-runtime/pi-rpc.sock
      WORKER_PI_EXTENSION_DIR: /opt/manor/worker/dist/server
      WORKER_BUTLER_BASE_URL: http://butler:8080
      MANOR_IMAGE_REFERENCE_DIR: /artifacts/manor-images
      BUTLER_PORT: 8080
      BUTLER_PUBLIC_PORT: ${BUTLER_HOST_PORT:-8180}
      BUTLER_HOT_RELOAD: 0
      BUTLER_TTYD_PORT: 7682
      BUTLER_TTYD_BASE_PATH: /butler-terminal/
      MANOR_PREVIEW_LEASE_TTL_MS: ${MANOR_PREVIEW_LEASE_TTL_MS:-1800000}
      MANOR_STACK_LEASE_TTL_MS: ${MANOR_STACK_LEASE_TTL_MS:-1800000}
      MANOR_SERVICE_LEASE_TTL_MS: ${MANOR_SERVICE_LEASE_TTL_MS:-1800000}
      MANOR_LEASE_REAP_GRACE_MS: ${MANOR_LEASE_REAP_GRACE_MS:-600000}
      MANOR_LEASE_SWEEP_INTERVAL_MS: ${MANOR_LEASE_SWEEP_INTERVAL_MS:-30000}
      MANOR_SELF_IMPROVEMENT_SOURCE_CWD: ${MANOR_SELF_IMPROVEMENT_SOURCE_CWD:-/repos/manor}
      CODEX_BASE_URL: ws://codex-box:8080
      CODEX_APP_SERVER_AUTH_TOKEN_FILE: /codex-config/manor/codex-app-server-token
      BUTLER_AUTH_BOOTSTRAP: ${BUTLER_AUTH_BOOTSTRAP:-auto}
      BUTLER_FORCED_LOGIN_METHOD: ${BUTLER_FORCED_LOGIN_METHOD:-}
      MANOR_SETTINGS_RESEED: ${MANOR_SETTINGS_RESEED:-0}
      MANOR_WORKER_HARNESS: ${MANOR_WORKER_HARNESS:-}
      MANOR_WORKER_MODEL: ${MANOR_WORKER_MODEL:-}
      MANOR_WORKER_EFFORT: ${MANOR_WORKER_EFFORT:-}
      MANOR_WORKER_PROVIDER: ${MANOR_WORKER_PROVIDER:-}
      MANOR_CODEX_PROVIDER: ${MANOR_CODEX_PROVIDER:-}
      MANOR_BUTLER_MODEL: ${MANOR_BUTLER_MODEL:-}
      MANOR_BUTLER_THINKING_LEVEL: ${MANOR_BUTLER_THINKING_LEVEL:-medium}
      MANOR_BUTLER_PROVIDER: ${MANOR_BUTLER_PROVIDER:-}
      MANOR_MEMORY_SYNTHESIS_ENABLED: ${MANOR_MEMORY_SYNTHESIS_ENABLED:-1}
      MANOR_MEMORY_SYNTHESIS_MODEL: ${MANOR_MEMORY_SYNTHESIS_MODEL:-openai-codex/gpt-5.4-mini}
      MANOR_MEMORY_SYNTHESIS_EFFORT: ${MANOR_MEMORY_SYNTHESIS_EFFORT:-}
      MANOR_MEMORY_SYNTHESIS_TIMEOUT_MS: ${MANOR_MEMORY_SYNTHESIS_TIMEOUT_MS:-90000}
      MANOR_MEMORY_SYNTHESIS_MAX_INPUT_CHARS: ${MANOR_MEMORY_SYNTHESIS_MAX_INPUT_CHARS:-16000}
      MANOR_MEMORY_SYNTHESIS_MAX_CANDIDATES: ${MANOR_MEMORY_SYNTHESIS_MAX_CANDIDATES:-6}
      MANOR_MEMORY_PROMOTION_MODEL: ${MANOR_MEMORY_PROMOTION_MODEL:-}
      MANOR_MEMORY_PROMOTION_AUTO_RESOLVE: ${MANOR_MEMORY_PROMOTION_AUTO_RESOLVE:-1}
      MANOR_MEMORY_PROMOTION_BATCH_SIZE: ${MANOR_MEMORY_PROMOTION_BATCH_SIZE:-20}
      MANOR_MEMORY_PROMOTION_MAX_BATCHES_PER_RUN: ${MANOR_MEMORY_PROMOTION_MAX_BATCHES_PER_RUN:-10}
      MANOR_MEMORY_PROMOTION_INTERVAL_MS: ${MANOR_MEMORY_PROMOTION_INTERVAL_MS:-10000}
      MANOR_ROUTING_CLASSIFIER_MODEL: ${MANOR_ROUTING_CLASSIFIER_MODEL:-}
      MANOR_SESSION_TITLE_MODEL: ${MANOR_SESSION_TITLE_MODEL:-openai-codex/gpt-5.4-mini}
      MANOR_SESSION_TITLE_TIMEOUT_MS: ${MANOR_SESSION_TITLE_TIMEOUT_MS:-15000}
      MANOR_MEMORY_EMBEDDINGS_ENABLED: ${MANOR_MEMORY_EMBEDDINGS_ENABLED:-1}
      MANOR_MEMORY_EMBEDDINGS_PROVIDER: ${MANOR_MEMORY_EMBEDDINGS_PROVIDER:-ollama}
      MANOR_MEMORY_EMBEDDINGS_HOST: ${MANOR_MEMORY_EMBEDDINGS_HOST:-http://ollama:11434}
      MANOR_MEMORY_EMBEDDINGS_MODEL: ${MANOR_MEMORY_EMBEDDINGS_MODEL:-qwen3-embedding:0.6b}
      MANOR_MEMORY_EMBEDDINGS_TIMEOUT_MS: ${MANOR_MEMORY_EMBEDDINGS_TIMEOUT_MS:-120000}
      MANOR_MEMORY_EMBEDDINGS_BACKFILL_BATCH_SIZE: ${MANOR_MEMORY_EMBEDDINGS_BACKFILL_BATCH_SIZE:-16}
      MANOR_MEMORY_SEMANTIC_EDGES_ENABLED: ${MANOR_MEMORY_SEMANTIC_EDGES_ENABLED:-1}
      MANOR_MEMORY_SEMANTIC_EDGES_BATCH_SIZE: ${MANOR_MEMORY_SEMANTIC_EDGES_BATCH_SIZE:-12}
      MANOR_MEMORY_SEMANTIC_EDGES_INTERVAL_MS: ${MANOR_MEMORY_SEMANTIC_EDGES_INTERVAL_MS:-60000}
      MANOR_OLLAMA_LOCAL_ENABLED: ${MANOR_OLLAMA_LOCAL_ENABLED:-1}
      MANOR_OLLAMA_LOCAL_PROVIDER_ID: ${MANOR_OLLAMA_LOCAL_PROVIDER_ID:-ollama-local}
      MANOR_OLLAMA_LOCAL_BASE_URL: ${MANOR_OLLAMA_LOCAL_BASE_URL:-http://ollama:11434/v1}
      MANOR_OLLAMA_LOCAL_NATIVE_BASE_URL: ${MANOR_OLLAMA_LOCAL_NATIVE_BASE_URL:-http://ollama:11434}
      MANOR_OLLAMA_LOCAL_API: ${MANOR_OLLAMA_LOCAL_API:-openai-completions}
      MANOR_OLLAMA_LOCAL_MODELS: ${MANOR_OLLAMA_LOCAL_MODELS:-}
      MANOR_OLLAMA_LOCAL_CONTEXT_WINDOW: ${MANOR_OLLAMA_LOCAL_CONTEXT_WINDOW:-65536}
      MANOR_OLLAMA_LOCAL_MAX_TOKENS: ${MANOR_OLLAMA_LOCAL_MAX_TOKENS:-16384}
      MANOR_OLLAMA_LOCAL_REASONING: ${MANOR_OLLAMA_LOCAL_REASONING:-1}
      OLLAMA_LOCAL_API_KEY: ${OLLAMA_LOCAL_API_KEY:-}
      OLLAMA_LOCAL_API_KEY_FILE: ${OLLAMA_LOCAL_API_KEY_FILE:-}
      MANOR_OLLAMA_CLOUD_ENABLED: ${MANOR_OLLAMA_CLOUD_ENABLED:-1}
      MANOR_OLLAMA_CLOUD_PROVIDER_ID: ${MANOR_OLLAMA_CLOUD_PROVIDER_ID:-ollama-cloud}
      MANOR_OLLAMA_CLOUD_BASE_URL: ${MANOR_OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      MANOR_OLLAMA_CLOUD_API: ${MANOR_OLLAMA_CLOUD_API:-openai-completions}
      MANOR_OLLAMA_CLOUD_MODELS: ${MANOR_OLLAMA_CLOUD_MODELS:-gpt-oss:120b,glm-5.2,kimi-k2.6,qwen3.5,deepseek-v4-flash,minimax-m3}
      MANOR_OLLAMA_CLOUD_CONTEXT_WINDOW: ${MANOR_OLLAMA_CLOUD_CONTEXT_WINDOW:-131072}
      MANOR_OLLAMA_CLOUD_MAX_TOKENS: ${MANOR_OLLAMA_CLOUD_MAX_TOKENS:-32768}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_API_KEY_FILE: ${OLLAMA_API_KEY_FILE:-}
      MANOR_OLLAMA_WEB_TOOLS_ENABLED: ${MANOR_OLLAMA_WEB_TOOLS_ENABLED:-1}
      MANOR_OLLAMA_WEB_TOOLS_BASE_URL: ${MANOR_OLLAMA_WEB_TOOLS_BASE_URL:-https://ollama.com/api}
      MANOR_OLLAMA_WEB_SEARCH_MAX_RESULTS: ${MANOR_OLLAMA_WEB_SEARCH_MAX_RESULTS:-5}
      MANOR_OLLAMA_WEB_TOOLS_TIMEOUT_MS: ${MANOR_OLLAMA_WEB_TOOLS_TIMEOUT_MS:-30000}
      MANOR_OLLAMA_WEB_TOOLS_MAX_CONTENT_CHARS: ${MANOR_OLLAMA_WEB_TOOLS_MAX_CONTENT_CHARS:-12000}
      MANOR_OLLAMA_WEB_TOOLS_FOR_ALL_PI_MODELS: ${MANOR_OLLAMA_WEB_TOOLS_FOR_ALL_PI_MODELS:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_API_KEY_FILE: ${OPENCODE_API_KEY_FILE:-}
      MANOR_OPENCODE_GO_ENABLED: ${MANOR_OPENCODE_GO_ENABLED:-0}
      MANOR_OPENCODE_GO_BASE_URL: ${MANOR_OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_ENABLE_EXA: ${OPENCODE_ENABLE_EXA:-1}
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      ALL_PROXY: http://egress:3128
      NODE_USE_ENV_PROXY: "1"
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      all_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,ollama,codex-box,butler,egress,preview-egress,runtime-broker,host-controller,playwright,desktop-proof
      no_proxy: localhost,127.0.0.1,ollama,codex-box,butler,egress,preview-egress,runtime-broker,host-controller,playwright,desktop-proof
      RUNTIME_BROKER_URL: http://runtime-broker:8090
      RUNTIME_BROKER_TOKEN: "${RUNTIME_BROKER_TOKEN:?Run ./install.sh or set RUNTIME_BROKER_TOKEN in .env.}"
      MANOR_HOST_CONTROLLER_URL: http://host-controller:8092
      MANOR_HOST_CONTROLLER_TOKEN: "${MANOR_HOST_CONTROLLER_TOKEN:?Run ./install.sh or set MANOR_HOST_CONTROLLER_TOKEN in .env.}"
    volumes:
      - butler-state:/state
      - butler-home:/home/butler/.codex
      - butler-pi:/home/butler/.pi
      - worker-pi:/worker-pi
      - worker-runtime:/worker-runtime
      - codex-home:/codex-home
      - codex-config:/codex-config:ro
      - harness-state:/harness-state
      - repos:/repos
      - artifacts:/artifacts
    depends_on:
      codex-box:
        condition: service_healthy
      egress:
        condition: service_healthy
      runtime-broker:
        condition: service_started
      host-controller:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:8080/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - control
      - internet
      - work

  ollama:
    image: ollama/ollama:latest
    container_name: manor-ollama
    entrypoint: ["/bin/sh", "-lc"]
    environment:
      MANOR_MEMORY_EMBEDDINGS_MODEL: ${MANOR_MEMORY_EMBEDDINGS_MODEL:-qwen3-embedding:0.6b}
    volumes:
      - ollama-state:/root/.ollama
    command:
      [
        "ollama serve & pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$${MANOR_MEMORY_EMBEDDINGS_MODEL:-qwen3-embedding:0.6b}\"; wait \"$$pid\""
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${MANOR_MEMORY_EMBEDDINGS_MODEL:-qwen3-embedding:0.6b}\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - control
      - internet

  butler-gateway:
    image: nginx:stable-alpine3.23
    container_name: manor-butler-gateway
    depends_on:
      butler:
        condition: service_started
    volumes:
      - ./docker/butler-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BUTLER_HOST_PORT:-8180}:8080"
      - "127.0.0.1:1455:1455"
    networks:
      - control
      - internet

  # Shared Worker environment. Codex app-server and Pi RPC Worker harnesses
  # execute here; Butler keeps only its own Pi-backed supervisor agent.
  codex-box:
    image: "${MANOR_IMAGE_REGISTRY:-ghcr.io/peter-olom}/manor-codex-box:${MANOR_IMAGE_TAG:-latest}"
    container_name: manor-codex-box
    hostname: manor-worker
    command: ["/usr/local/bin/start-codex-app-server"]
    working_dir: /repos
    environment:
      MANOR_ROLE: worker
      MANOR_STATE_DIR: /state
      MANOR_BUTLER_BASE_URL: http://butler:8080
      MANOR_RUNTIME_BROKER_URL: http://runtime-broker:8090
      MANOR_HARNESS_HOME: /harness-state
      MANOR_HARNESS_REGISTRY_PATH: /harness-state/harness-capabilities.json
      HOME: /home/worker
      CODEX_HOME: /home/worker/.codex
      PI_AGENT_DIR: /worker-pi/agent
      PI_CODING_AGENT_DIR: /worker-pi/agent
      WORKER_PI_SESSION_ROOT: /worker-pi/sessions
      WORKER_PI_RPC_SOCKET: /worker-runtime/pi-rpc.sock
      WORKER_REPOS_ROOT: /repos
      NODE_USE_ENV_PROXY: "1"
      CODEX_APP_SERVER_LISTEN: ws://0.0.0.0:8080
      CODEX_APP_SERVER_WS_AUTH: capability-token
      CODEX_APP_SERVER_WS_TOKEN_FILE: /home/worker/.config/manor/codex-app-server-token
      CODEX_PERSONALITY: ${CODEX_PERSONALITY:-pragmatic}
      CODEX_SERVICE_TIER: ${CODEX_SERVICE_TIER:-auto}
      CODEX_MODEL_INSTRUCTIONS_FILE: ${CODEX_MODEL_INSTRUCTIONS_FILE:-/opt/manor/config/codex-model-instructions.md}
      CODEX_AUTH_BOOTSTRAP: ${CODEX_AUTH_BOOTSTRAP:-auto}
      CODEX_FORCED_LOGIN_METHOD: ${CODEX_FORCED_LOGIN_METHOD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      OLLAMA_LOCAL_API_KEY: ${OLLAMA_LOCAL_API_KEY:-}
      OLLAMA_LOCAL_API_KEY_FILE: ${OLLAMA_LOCAL_API_KEY_FILE:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_API_KEY_FILE: ${OLLAMA_API_KEY_FILE:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_API_KEY_FILE: ${OPENCODE_API_KEY_FILE:-}
      MANOR_OLLAMA_LOCAL_ENABLED: ${MANOR_OLLAMA_LOCAL_ENABLED:-1}
      MANOR_OLLAMA_LOCAL_PROVIDER_ID: ${MANOR_OLLAMA_LOCAL_PROVIDER_ID:-ollama-local}
      MANOR_OLLAMA_LOCAL_BASE_URL: ${MANOR_OLLAMA_LOCAL_BASE_URL:-http://ollama:11434/v1}
      MANOR_OLLAMA_LOCAL_NATIVE_BASE_URL: ${MANOR_OLLAMA_LOCAL_NATIVE_BASE_URL:-http://ollama:11434}
      MANOR_OLLAMA_LOCAL_API: ${MANOR_OLLAMA_LOCAL_API:-openai-completions}
      MANOR_OLLAMA_LOCAL_MODELS: ${MANOR_OLLAMA_LOCAL_MODELS:-}
      MANOR_OLLAMA_LOCAL_CONTEXT_WINDOW: ${MANOR_OLLAMA_LOCAL_CONTEXT_WINDOW:-65536}
      MANOR_OLLAMA_LOCAL_MAX_TOKENS: ${MANOR_OLLAMA_LOCAL_MAX_TOKENS:-16384}
      MANOR_OLLAMA_LOCAL_REASONING: ${MANOR_OLLAMA_LOCAL_REASONING:-1}
      MANOR_OLLAMA_CLOUD_ENABLED: ${MANOR_OLLAMA_CLOUD_ENABLED:-1}
      MANOR_OLLAMA_CLOUD_PROVIDER_ID: ${MANOR_OLLAMA_CLOUD_PROVIDER_ID:-ollama-cloud}
      MANOR_OLLAMA_CLOUD_BASE_URL: ${MANOR_OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      MANOR_OLLAMA_CLOUD_API: ${MANOR_OLLAMA_CLOUD_API:-openai-completions}
      MANOR_OLLAMA_CLOUD_MODELS: ${MANOR_OLLAMA_CLOUD_MODELS:-gpt-oss:120b,glm-5.2,kimi-k2.6,qwen3.5,deepseek-v4-flash,minimax-m3}
      MANOR_OLLAMA_CLOUD_CONTEXT_WINDOW: ${MANOR_OLLAMA_CLOUD_CONTEXT_WINDOW:-131072}
      MANOR_OLLAMA_CLOUD_MAX_TOKENS: ${MANOR_OLLAMA_CLOUD_MAX_TOKENS:-32768}
      MANOR_OLLAMA_WEB_TOOLS_ENABLED: ${MANOR_OLLAMA_WEB_TOOLS_ENABLED:-1}
      MANOR_OLLAMA_WEB_TOOLS_BASE_URL: ${MANOR_OLLAMA_WEB_TOOLS_BASE_URL:-https://ollama.com/api}
      MANOR_OLLAMA_WEB_SEARCH_MAX_RESULTS: ${MANOR_OLLAMA_WEB_SEARCH_MAX_RESULTS:-5}
      MANOR_OLLAMA_WEB_TOOLS_TIMEOUT_MS: ${MANOR_OLLAMA_WEB_TOOLS_TIMEOUT_MS:-30000}
      MANOR_OLLAMA_WEB_TOOLS_MAX_CONTENT_CHARS: ${MANOR_OLLAMA_WEB_TOOLS_MAX_CONTENT_CHARS:-12000}
      MANOR_OLLAMA_WEB_TOOLS_FOR_ALL_PI_MODELS: ${MANOR_OLLAMA_WEB_TOOLS_FOR_ALL_PI_MODELS:-0}
      MANOR_OPENCODE_GO_ENABLED: ${MANOR_OPENCODE_GO_ENABLED:-0}
      MANOR_OPENCODE_GO_BASE_URL: ${MANOR_OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_ENABLE_EXA: ${OPENCODE_ENABLE_EXA:-1}
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      ALL_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      all_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,ollama,codex-box,manor-worker,butler,egress,preview-egress,runtime-broker,host-controller,playwright,desktop-proof
      no_proxy: localhost,127.0.0.1,ollama,codex-box,manor-worker,butler,egress,preview-egress,runtime-broker,host-controller,playwright,desktop-proof
    depends_on:
      egress:
        condition: service_healthy
    volumes:
      - codex-state:/state
      - codex-home:/home/worker/.codex
      - codex-config:/home/worker/.config
      - harness-state:/harness-state
      - worker-pi:/worker-pi
      - worker-runtime:/worker-runtime
      - butler-state:/legacy-butler-state:ro
      - ./config/codex-model-instructions.md:/opt/manor/config/codex-model-instructions.md:ro
      - repos:/repos
      - artifacts:/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/opt/manor/codex-box/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - control
      - work

  egress:
    image: "${MANOR_IMAGE_REGISTRY:-ghcr.io/peter-olom}/manor-egress:${MANOR_IMAGE_TAG:-latest}"
    container_name: manor-egress
    command: ["sh", "-lc", "rm -f /tmp/squid.pid && exec squid -N -f /etc/squid/squid.conf"]
    environment:
      MANOR_ROLE: egress
    volumes:
      - egress-state:/state
    healthcheck:
      test: ["CMD", "sh", "-lc", "nc -z 127.0.0.1 3128"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - work
      - internet

  preview-egress:
    image: "${MANOR_IMAGE_REGISTRY:-ghcr.io/peter-olom}/manor-preview-egress:${MANOR_IMAGE_TAG:-latest}"
    container_name: manor-preview-egress
    environment:
      MANOR_ROLE: preview-egress
      PREVIEW_EGRESS_PROFILES_FILE: /opt/manor/config/preview-egress-profiles.json
      PREVIEW_EGRESS_ADMIN_PORT: 8091
      PREVIEW_EGRESS_DYNAMIC_PORT_START: 3200
      PREVIEW_EGRESS_DYNAMIC_PORT_END: 3299
    volumes:
      - ./config/preview-egress-profiles.json:/opt/manor/config/preview-egress-profiles.json:ro
      - preview-egress-state:/state
    healthcheck:
      test: ["CMD", "sh", "-lc", "nc -z 127.0.0.1 3128"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - preview
      - internet

  runtime-broker:
    image: "${MANOR_IMAGE_REGISTRY:-ghcr.io/peter-olom}/manor-runtime-broker:${MANOR_IMAGE_TAG:-latest}"
    container_name: manor-runtime-broker
    environment:
      MANOR_ROLE: runtime-broker
      RUNTIME_BROKER_PORT: 8090
      RUNTIME_HARNESS_ACCESS_FILE: /state/harness-broker-access.json
      RUNTIME_WORKSPACE_CONTAINER: manor-codex-box
      RUNTIME_STACK_BINDINGS_FILE: /runtime-state/stack-thread-bindings.json
      RUNTIME_PREVIEW_NETWORK: manor_preview
      RUNTIME_PREVIEW_EGRESS_CONFIG: /opt/manor/config/preview-egress-profiles.json
      RUNTIME_PREVIEW_EGRESS_ADMIN_URL: http://preview-egress:8091
      RUNTIME_PREVIEW_IMAGE: node:24-trixie
      RUNTIME_SERVICE_SHARED_NETWORK: manor_work
      RUNTIME_ROUTE_BASE: /preview
      RUNTIME_OPERATOR_BASE_URL: ${RUNTIME_OPERATOR_BASE_URL:-http://127.0.0.1:${BUTLER_HOST_PORT:-8180}}
      RUNTIME_OPERATOR_BASE_URL_INTERNAL: http://butler:8080
      RUNTIME_PLAYWRIGHT_CONTAINER: manor-playwright
      RUNTIME_PLAYWRIGHT_CONTROL_URL: http://playwright:3777
      RUNTIME_DESKTOP_PROOF_CONTAINER: manor-desktop-proof
      RUNTIME_DESKTOP_PROOF_CONTROL_URL: http://desktop-proof:3888
      RUNTIME_BROKER_TOKEN: "${RUNTIME_BROKER_TOKEN:?Run ./install.sh or set RUNTIME_BROKER_TOKEN in .env.}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/preview-egress-profiles.json:/opt/manor/config/preview-egress-profiles.json:ro
      - butler-state:/state:ro
      - runtime-broker-state:/runtime-state
    depends_on:
      preview-egress:
        condition: service_healthy
      playwright:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health').then((response)=>{if(!response.ok) process.exit(1);}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - control
      - preview

  host-controller:
    image: "${MANOR_IMAGE_REGISTRY:-ghcr.io/peter-olom}/manor-host-controller:${MANOR_IMAGE_TAG:-latest}"
    container_name: manor-host-controller
    hostname: manor-host-controller
    environment:
      MANOR_ROLE: host-controller
      BUTLER_AUTH_BOOTSTRAP: ${BUTLER_AUTH_BOOTSTRAP:-auto}
      BUTLER_FORCED_LOGIN_METHOD: ${BUTLER_FORCED_LOGIN_METHOD:-}
      BUTLER_HOST_PORT: ${BUTLER_HOST_PORT:-8180}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-manor}
      CODEX_AUTH_BOOTSTRAP: ${CODEX_AUTH_BOOTSTRAP:-auto}
      CODEX_FORCED_LOGIN_METHOD: ${CODEX_FORCED_LOGIN_METHOD:-}
