      MANOR_COMPOSE_PROJECT_NAME: ${MANOR_COMPOSE_PROJECT_NAME:-${COMPOSE_PROJECT_NAME:-manor}}
      MANOR_HOST_PROJECT_DIR: ${MANOR_HOST_PROJECT_DIR:-${MANOR_HOST_PROJECT_SOURCE_DIR:-${PWD:-/host-project}}}
      MANOR_HOST_PROJECT_SOURCE_DIR: ${MANOR_HOST_PROJECT_SOURCE_DIR:-${PWD:-.}}
      MANOR_SOURCE_HEAD: ${MANOR_SOURCE_HEAD:-unknown}
      MANOR_SOURCE_DIRTY: ${MANOR_SOURCE_DIRTY:-unknown}
