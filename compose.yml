      - ${MANOR_HOST_PROJECT_SOURCE_DIR:-${PWD:-.}}:${MANOR_HOST_PROJECT_DIR:-${MANOR_HOST_PROJECT_SOURCE_DIR:-${PWD:-/host-project}}}
      - host-controller-state:/state
    working_dir: ${MANOR_HOST_PROJECT_DIR:-${MANOR_HOST_PROJECT_SOURCE_DIR:-${PWD:-/host-project}}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - control
      - work

  playwright:
    image: "${MANOR_IMAGE_REGISTRY:-ghcr.io/peter-olom}/manor-playwright:${MANOR_IMAGE_TAG:-latest}"
    container_name: manor-playwright
    environment:
      MANOR_ROLE: playwright
    shm_size: "2gb"
    volumes:
      - playwright-state:/state
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3777/health').then((response)=>{if(!response.ok) process.exit(1);}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - control
      - work
      - internet

  desktop-proof:
    profiles: ["desktop"]
    image: "${MANOR_IMAGE_REGISTRY:-ghcr.io/peter-olom}/manor-desktop-proof:${MANOR_IMAGE_TAG:-latest}"
    container_name: manor-desktop-proof
    environment:
      MANOR_ROLE: desktop-proof
      MANOR_DESKTOP_PROOF_PORT: 3888
      MANOR_DESKTOP_PROOF_VNC_PORT: 6080
      MANOR_DESKTOP_PROOF_RFB_PORT: 5900
      MANOR_DESKTOP_PROOF_HOME: /state/home
      DISPLAY: :99
    shm_size: "2gb"
    ports:
      - "127.0.0.1:${DESKTOP_PROOF_NOVNC_PORT:-6080}:6080"
    volumes:
      - desktop-proof-state:/state
      - repos:/repos
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3888/health').then((response)=>{if(!response.ok) process.exit(1);}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - control
      - work
      - internet

