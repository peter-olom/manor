      MANOR_OLLAMA_WEB_TOOLS_TIMEOUT_MS: ${MANOR_OLLAMA_WEB_TOOLS_TIMEOUT_MS:-30000}
      MANOR_OPENCODE_GO_BASE_URL: ${MANOR_OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
